<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка безопасности</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f4f5;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1a1a1a}
.wrap{background:#fff;border-radius:10px;padding:44px 40px;max-width:460px;width:100%;box-shadow:0 2px 16px rgba(0,0,0,.09);text-align:center}
h1{font-size:1.35rem;font-weight:600;margin-bottom:10px}
.sub{color:#555;font-size:.88rem;line-height:1.6;margin-bottom:28px}
.sub small{display:block;color:#888;margin-top:4px}
.error{color:#b91c1c;font-size:.88rem;margin-bottom:18px;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px}
.captcha-wrap{display:flex;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
    <h1>Проверка безопасности</h1>
    <p class="sub">Для продолжения подтвердите, что вы не робот.<small>To continue, please verify you are not a robot.</small></p>
    
    <form method="POST" action="" id="bp-form">
        <input type="hidden" name="smart-token" id="smart-token" value="">
        <div class="captcha-wrap">
            <div class="smart-captcha"
                 data-sitekey="ysc1_u5kDduK44hSTerR4tV1dgUxibF4IZg789wLf4lFA48196d8d"
                 data-callback="onCaptchaSuccess"
                 data-hl="ru">
            </div>
        </div>
    </form>
</div>
<script>
function onCaptchaSuccess(token) {
    document.getElementById('smart-token').value = token;
    document.getElementById('bp-form').submit();
}
</script>
<script src="https://smartcaptcha.yandexcloud.net/captcha.js" defer></script>
</body>
</html>
